<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Botany 4.1 — Question Bank</title>
<style>
:root{--bar:56px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#242424;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
#toolbar{
  position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:9999;
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:rgba(17,17,17,.98);box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.tool{
  width:42px;height:40px;border:1px solid #666;border-radius:8px;
  background:#303030;color:#fff;font-size:21px;line-height:1;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.tool:active{transform:scale(.96)}
#zoomLabel{
  min-width:64px;height:40px;border:1px solid #666;border-radius:8px;
  background:#222;color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer
}
#title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:4px;flex:1}
#status{font-size:12px;opacity:.75;white-space:nowrap}
#viewer{
  position:absolute;left:0;right:0;top:var(--bar);bottom:0;
  overflow:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:12px 8px 48px;
}
.page{display:block;margin:0 auto 14px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.5);max-width:none}
#hint{
  position:fixed;right:12px;bottom:12px;z-index:9998;
  padding:7px 10px;border-radius:8px;background:rgba(0,0,0,.65);
  color:rgba(255,255,255,.8);font-size:11px;pointer-events:none;
}
@media(max-width:600px){
  :root{--bar:54px}
  #toolbar{padding:6px 7px;gap:6px}
  .tool{width:40px;height:38px}
  #zoomLabel{min-width:60px;height:38px}
  #title{font-size:12px}
  #status{display:none}
}
</style>
</head>
<body>
<header id="toolbar" aria-label="PDF controls">
  <button class="tool" id="zoomOut" aria-label="Zoom out">−</button>
  <button id="zoomLabel" aria-label="Reset zoom">100%</button>
  <button class="tool" id="zoomIn" aria-label="Zoom in">+</button>
  <div id="title">Botany 4.1 — Question Bank</div>
  <div id="status">Loading…</div>
</header>

<main id="viewer" aria-label="Document pages"></main>
<div id="hint">Pinch or use − / + to zoom</div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const viewer = document.getElementById("viewer");
const status = document.getElementById("status");
const zoomLabel = document.getElementById("zoomLabel");
let pdf = null;
let zoom = 1.0;
let rendering = false;
let renderTimer = null;

const MIN_ZOOM = 0.5;
const MAX_ZOOM = 3.0;
const STEP = 0.25;

function updateZoomLabel(){
  zoomLabel.textContent = Math.round(zoom * 100) + "%";
}

function pageScale(page){
  const base = page.getViewport({scale:1});
  const available = Math.max(280, window.innerWidth - 24);
  const fit = Math.min(available / base.width, 1.25);
  return fit * zoom;
}

async function renderDocument(){
  if(!pdf || rendering) return;
  rendering = true;

  const oldScroll = viewer.scrollTop;
  viewer.innerHTML = "";
  status.textContent = `Rendering ${pdf.numPages} pages…`;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  for(let n = 1; n <= pdf.numPages; n++){
    const page = await pdf.getPage(n);
    const viewport = page.getViewport({scale: pageScale(page)});

    const canvas = document.createElement("canvas");
    canvas.className = "page";

    // Render at higher resolution for sharper text while keeping memory reasonable.
    canvas.width = Math.ceil(viewport.width * dpr);
    canvas.height = Math.ceil(viewport.height * dpr);
    canvas.style.width = Math.ceil(viewport.width) + "px";
    canvas.style.height = Math.ceil(viewport.height) + "px";

    viewer.appendChild(canvas);

    const ctx = canvas.getContext("2d", {alpha:false});
    await page.render({
      canvasContext: ctx,
      viewport,
      transform: dpr !== 1 ? [dpr,0,0,dpr,0,0] : null
    }).promise;
  }

  viewer.scrollTop = oldScroll;
  status.textContent = `${pdf.numPages} pages`;
  rendering = false;
}

async function changeZoom(amount){
  if(!pdf) return;
  zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom + amount));
  updateZoomLabel();
  await renderDocument();
}

document.getElementById("zoomIn").addEventListener("click", () => changeZoom(STEP));
document.getElementById("zoomOut").addEventListener("click", () => changeZoom(-STEP));
zoomLabel.addEventListener("click", async () => {
  zoom = 1;
  updateZoomLabel();
  await renderDocument();
});

window.addEventListener("resize", () => {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => renderDocument(), 250);
});

// Keyboard controls for PC.
document.addEventListener("keydown", e => {
  if(e.key === "+" || e.key === "=") { e.preventDefault(); changeZoom(STEP); }
  if(e.key === "-" || e.key === "_") { e.preventDefault(); changeZoom(-STEP); }
  if(e.key === "0") { e.preventDefault(); zoom=1; updateZoomLabel(); renderDocument(); }

  // Block common casual save/print shortcuts.
  if((e.ctrlKey || e.metaKey) && ["s","p","u"].includes(e.key.toLowerCase())){
    e.preventDefault();
  }
  if(e.key === "F12") e.preventDefault();
});

// Disable context menu in the viewer.
document.addEventListener("contextmenu", e => e.preventDefault());

updateZoomLabel();

try{
  pdf = await pdfjsLib.getDocument({
    url: "document.pdf",
    disableAutoFetch: false,
    disableStream: false
  }).promise;

  await renderDocument();
}catch(err){
  console.error(err);
  status.textContent = "Could not load PDF";
  viewer.innerHTML =
    '<div style="padding:30px;text-align:center">Unable to load the document. Make sure <b>document.pdf</b> is in the same GitHub Pages folder as this index.html.</div>';
}
</script>
</body>
</html>
